[package]
name = "kindred"
version = "0.1.0"
description = "A quiet space to connect ideas"
authors = ["Kindred"]
edition = "2021"

[lib]
name = "kindred_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
